<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Room | Hostel Management System</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .form-outer-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 120px);
        }

        .admin-form-card {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            text-align: center;
            color: #2c3e50;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #e67e22;
        }

        .btn-submit {
            width: 100%;
            background-color: #e67e22;
            color: #ffffff;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #d35400;
        }
    </style>
</head>

<body>

    <div class="dashboard-wrapper">
        <!-- Sidebar Starts -->
        <aside class="sidebar">
            <div>
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fa-solid fa-person-running"></i>
                    </div>
                    <div class="logo-text">HOSTEL MANAGEMENT</div>
                </div>

                <ul class="menu-list">
                    <li class="menu-item"><a href="/dashboard" class="menu-link"><i class="fa-solid fa-table-cells-large"></i><span>Dashboard</span></a></li>
                    <li class="menu-item"><a href="/student_records" class="menu-link"><i class="fa-regular fa-folder-open"></i><span>Student Records</span></a></li>
                    <li class="menu-item"><a href="/add_student" class="menu-link"><i class="fa-solid fa-plus"></i><span>Add Student</span></a></li>
                    <!-- <li class="menu-item"><a href="/add_admin" class="menu-link"><i class="fa-solid fa-user-plus"></i><span>Add Admin</span></a></li> -->
                  
                    <li class="menu-item"><a href="/rooms" class="menu-link active"><i class="fa-solid fa-bed"></i><span>Rooms</span></a></li>
                    <li class="menu-item"><a href="/fees" class="menu-link"><i class="fa-solid fa-indian-rupee-sign"></i><span>Fees</span></a></li>
                      <li class="menu-item"><a href="/all_admins" class="menu-link"><i class="fa-solid fa-users"></i><span>All Admins</span></a></li>
                </ul>
            </div>

            <a href="/login" class="logout-btn"><span>Logout</span></a>
        </aside>
        <!-- Sidebar Ends -->

        <!-- Main Content Starts -->
        <main class="main-content">
            <div class="form-outer-wrapper">
                <div class="admin-form-card">
                    <h2 class="form-title">Enter Room Details</h2>

                    <form id="roomForm" action="/add_room" method="POST" autocomplete="off">
                        <div class="form-group">
                            <label for="room_number">Room Number / Name</label>
                            <input type="text" id="room_number" name="room_number" placeholder="e.g. 101, A-1, etc." required>
                        </div>

                        <button type="submit" class="btn-submit">+ Add Room</button>
                    </form>
                </div>
            </div>
        </main>
        <!-- Main Content Ends -->
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <script>
        Swal.fire({
            title: "{% if category == 'success' %}Success!{% else %}Error!{% endif %}",
            text: "{{ message }}",
            icon: "{{ 'error' if category == 'danger' else category }}",
            confirmButtonColor: "#e67e22"
        });
    </script>
    {% endfor %}
    {% endif %}
    {% endwith %}

</body>

</html>
